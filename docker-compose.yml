version: '3.8'

services:
  # MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: healix_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: healix_root_password
      MYSQL_DATABASE: healix_db
      MYSQL_USER: healix_user
      MYSQL_PASSWORD: healix_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phealix_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - healix_network

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healix_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://healix_user:healix_password@mysql:3306/healix_db
      JWT_SECRET_KEY: healix_docker_secret_key_production_grade_2026_xyz
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
      ENVIRONMENT: development
      DEBUG: "true"
      AI_PROVIDER: mock
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - healix_network

volumes:
  mysql_data:
    driver: local

networks:
  healix_network:
    driver: bridge
